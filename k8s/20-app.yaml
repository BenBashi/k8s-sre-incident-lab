# The application layer. reset.sh deletes and re-applies this file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: shop
data:
  KAFKA_BOOTSTRAP: "kafka:9092"
  KAFKA_TOPIC: "orders"
  DB_HOST: "mysql"
  DB_NAME: "shop"
  MONGO_HOST: "mongo"
---
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: shop
stringData:
  DB_USER: shop
  DB_PASSWORD: shop-pass
---
apiVersion: v1
kind: Secret
metadata:
  name: worker-secrets
  namespace: shop
stringData:
  MONGO_USER: worker
  MONGO_PASSWORD: worker-pass
  MONGO_AUTH_SOURCE: shop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: shop
  labels: {app: orders-api}
spec:
  replicas: 2
  selector: {matchLabels: {app: orders-api}}
  template:
    metadata:
      labels: {app: orders-api}
    spec:
      containers:
        - name: app
          image: bootcamp/shop-app:1.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: ROLE, value: api}
            - {name: SERVICE_NAME, value: orders-api}
          envFrom:
            - configMapRef: {name: app-config}
            - secretRef: {name: api-secrets}
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /ready, port: 8080}
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 60
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
  namespace: shop
spec:
  selector: {app: orders-api}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orders-api
  namespace: shop
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: orders-api}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 60}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-worker
  namespace: shop
  labels: {app: orders-worker}
spec:
  replicas: 1
  selector: {matchLabels: {app: orders-worker}}
  template:
    metadata:
      labels: {app: orders-worker}
    spec:
      containers:
        - name: app
          image: bootcamp/shop-app:1.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: ROLE, value: worker}
            - {name: SERVICE_NAME, value: orders-worker}
          envFrom:
            - configMapRef: {name: app-config}
            - secretRef: {name: worker-secrets}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 192Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: shop
  labels: {app: loadgen}
spec:
  replicas: 1
  selector: {matchLabels: {app: loadgen}}
  template:
    metadata:
      labels: {app: loadgen}
    spec:
      containers:
        - name: loadgen
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -X POST \
                  -H 'Content-Type: application/json' -H 'X-Client: web-checkout' -d '{"item":"book","qty":2}' http://orders-api/orders)
                echo "{\"level\":\"INFO\",\"service\":\"loadgen\",\"msg\":\"POST /orders\",\"status\":\"$code\"}"
                curl -s -o /dev/null --max-time 5 "http://orders-api/burn?ms=${BURN_MS:-50}"
                sleep 0.5
              done
          env:
            - {name: BURN_MS, value: "50"}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
