# Kafka UI: a web interface to see brokers, topics, partitions, messages and consumer lag.
# kubectl apply -f k8s/30-kafka-ui.yaml
# kubectl -n shop port-forward svc/kafka-ui 8081:80     -> http://localhost:8081
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: shop
  labels: {app: kafka-ui}
spec:
  replicas: 1
  selector: {matchLabels: {app: kafka-ui}}
  template:
    metadata:
      labels: {app: kafka-ui}
    spec:
      enableServiceLinks: false
      containers:
        - name: kafka-ui
          image: ghcr.io/kafbat/kafka-ui:latest
          env:
            - {name: KAFKA_CLUSTERS_0_NAME, value: bootcamp}
            - {name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS, value: "kafka:9092"}
            - {name: DYNAMIC_CONFIG_ENABLED, value: "true"}
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 768Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: shop
spec:
  selector: {app: kafka-ui}
  ports: [{port: 80, targetPort: 8080}]
