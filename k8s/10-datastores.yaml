# MySQL, MongoDB and Kafka (single-node, no persistence: it's a lab).
apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
  namespace: shop
stringData:
  MYSQL_ROOT_PASSWORD: root-pass
  MYSQL_DATABASE: shop
  MYSQL_USER: shop
  MYSQL_PASSWORD: shop-pass
---
apiVersion: v1
kind: Secret
metadata:
  name: mongo-credentials
  namespace: shop
stringData:
  MONGO_INITDB_ROOT_USERNAME: root
  MONGO_INITDB_ROOT_PASSWORD: mongo-pass
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: shop
  labels: {app: mysql}
spec:
  replicas: 1
  selector: {matchLabels: {app: mysql}}
  template:
    metadata:
      labels: {app: mysql}
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          args: ["--max-connections=40"]
          envFrom: [{secretRef: {name: mysql-credentials}}]
          ports: [{containerPort: 3306}]
          readinessProbe:
            exec: {command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""]}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: shop
spec:
  selector: {app: mysql}
  ports: [{port: 3306, targetPort: 3306}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongo-init
  namespace: shop
data:
  01-worker-user.js: |
    db = db.getSiblingDB('shop');
    db.createUser({user: 'worker', pwd: 'worker-pass', roles: [{role: 'readWrite', db: 'shop'}]});
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: shop
  labels: {app: mongo}
spec:
  replicas: 1
  selector: {matchLabels: {app: mongo}}
  template:
    metadata:
      labels: {app: mongo}
    spec:
      containers:
        - name: mongo
          image: mongo:7
          envFrom: [{secretRef: {name: mongo-credentials}}]
          ports: [{containerPort: 27017}]
          volumeMounts:
            - {name: init, mountPath: /docker-entrypoint-initdb.d}
          readinessProbe:
            tcpSocket: {port: 27017}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1536Mi}
      volumes:
        - name: init
          configMap: {name: mongo-init}
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: shop
spec:
  selector: {app: mongo}
  ports: [{port: 27017, targetPort: 27017}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: shop
  labels: {app: kafka}
spec:
  replicas: 1
  selector: {matchLabels: {app: kafka}}
  template:
    metadata:
      labels: {app: kafka}
    spec:
      # Without this, K8s injects KAFKA_PORT=tcp://... which the Kafka image misreads as config.
      enableServiceLinks: false
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          ports: [{containerPort: 9092}]
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
            - {name: KAFKA_NUM_PARTITIONS, value: "3"}
          readinessProbe:
            tcpSocket: {port: 9092}
            periodSeconds: 5
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: shop
spec:
  selector: {app: kafka}
  ports: [{name: plaintext, port: 9092, targetPort: 9092}]
